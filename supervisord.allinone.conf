; Drop-in for /etc/supervisor/conf.d/ — the apt `supervisor` package's main
; /etc/supervisor/supervisord.conf already includes conf.d/*.conf, so this
; file only needs the two [program:] blocks.

[program:backend]
command=/opt/venv/bin/uvicorn app:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips * --timeout-graceful-shutdown 15
directory=/app
user=appuser
autostart=true
autorestart=true
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
