# Same as dashboard/nginx.conf, but the backend is now the SAME container
# (127.0.0.1:8000) instead of a separate "backend" host on the Docker network.
# The openshorts.app -> www redirect block is dropped since it's meaningless
# for a self-hosted instance.

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }
    location /videos/ {
        proxy_pass http://127.0.0.1:8000;
    }
    location /thumbnails/ {
        proxy_pass http://127.0.0.1:8000;
    }
    location /gallery {
        proxy_pass http://127.0.0.1:8000;
    }
    location /video/ {
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
