# Save this file as .github/workflows/build-allinone.yml in your fork.
name: Build All-in-One Image

on:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'requirements*.txt'
      - 'dashboard/**'
      - 'Dockerfile.allinone'
      - 'nginx.allinone.conf'
      - 'supervisord.allinone.conf'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Set up Docker Buildx (Cloud)
        uses: docker/setup-buildx-action@v3
        with:
          driver: cloud
          endpoint: "stvn24/Steven"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.allinone
          push: true
          tags: |
            osilama2k24/openshorts-allinone:latest
            osilama2k24/openshorts-allinone:${{ github.sha }}
